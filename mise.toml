[tools]
go = "1.27"
task = "3"
lefthook = "latest"
golangci-lint = "2"
goreleaser = "2"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:mvdan.cc/gofumpt" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "latest"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "latest"
"go:github.com/air-verse/air" = "latest"
node = "26"
buf = "latest"
python = "latest"
uv = "latest"

[env]
CGO_ENABLED = "0"

[tasks.serena]
description = "Inicia o MCP do Serena via stdio usando uvx"
run = "uvx --from serena-agent serena start-mcp-server --project-from-cwd"
