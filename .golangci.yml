version: "2"
run:
  tests: true
linters:
  enable:
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G204
        - G304
        - G703
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
