root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = ["serve", "--port", "3000"]
bin = "./tmp/daneel"
cmd = "go build -o ./tmp/daneel main.go"
delay = 500
exclude_dir = [
  "web",
  "bin",
  "tmp",
  ".git",
  ".dev",
  "internal/webfs/dist",
  "docs",
  ".agents"
]
exclude_file = [
  "HANDOFF-DANEEL-DAEMON-ROUTINES.md"
]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
follow_symlink = false
full_bin = ""
include_dir = ["cmd", "internal", "api"]
include_ext = ["go", "yaml", "proto"]
include_file = ["main.go"]
kill_delay = 500
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
