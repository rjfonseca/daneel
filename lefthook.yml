# lefthook.yml
# Git hooks manager for Daneel (https://github.com/evilmartians/lefthook)

pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.go"
      run: goimports -w -local github.com/rjfonseca/daneel {staged_files}
      stage_fixed: true

    lint:
      glob: "*.go"
      run: golangci-lint run

    frontend-lint:
      glob: "web/**/*.{js,ts,jsx,tsx}"
      root: "web/"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    frontend-test:
      glob: "web/**/*.{js,ts,jsx,tsx}"
      root: "web/"
      run: npx vitest related --run --passWithNoTests {staged_files}

pre-push:
  parallel: false
  commands:
    lint:
      run: task lint

    test:
      run: task test

    scripts-test:
      run: |
        python3 -m unittest discover -s scripts -p test_task_git_isolation.py
        python3 -m unittest discover -s scripts -p test_check_codex_hooks.py
        python3 -m unittest discover -s scripts -p 'test_release_*.py'
        python3 scripts/smoke.py

    vulncheck:
      run: task vulncheck

    frontend-audit:
      root: "web/"
      run: npm run audit

    frontend-lint:
      root: "web/"
      run: npm run lint

    frontend-typecheck:
      root: "web/"
      run: npm run typecheck

    frontend-test-full:
      root: "web/"
      run: npm run test

    webfs-sync:
      run: task web-verify-sync

    bench:
      run: task bench

    check-ci-configs:
      run: |
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        if command -v goreleaser >/dev/null 2>&1; then goreleaser check; fi
