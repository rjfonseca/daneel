name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    name: GoReleaser Release
    needs: checks
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.11.1"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Build Canonical Web Assets from Source
        run: cd web && npm run build

      - name: Verify WebFS Dist Integrity (Release Anti-Tampering Check)
        run: |
          rm -rf internal/webfs/dist && cp -r web/dist internal/webfs/dist
          if ! git diff --exit-code internal/webfs/dist; then
            echo "::error::Tagged commit contains out-of-sync or directly modified internal/webfs/dist assets!"
            echo "::error::Release aborted. Binary releases must only contain assets built directly from verified source."
            exit 1
          fi
          echo "✅ Release WebFS assets verified against source"

      - name: Install pinned SBOM generator
        uses: anchore/sbom-action/download-syft@v0.24.3
        with:
          syft-version: v1.54.1

      - name: Stage release artifacts as a draft
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Smoke test the native release archive
        run: python scripts/smoke.py --archive dist/daneel_*_linux_amd64.tar.gz

      - name: Attest release archives and SBOMs
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt

  native-archive-smoke:
    name: Native archive smoke (${{ matrix.os }})
    needs: goreleaser
    # Authenticated draft downloads require repository write access.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify and exercise the matching draft archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_archive_smoke.py

  publish:
    name: Publish validated release
    needs: native-archive-smoke
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish the validated draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
