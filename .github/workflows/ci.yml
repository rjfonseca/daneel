name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit selected by the release planner
        type: string
        required: false
        default: ""
  push:
    branches: ['release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Golangci Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Unit & Integration Tests
        run: go test -v -cover ./...

      - name: Install pinned Task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Verify Git hook test isolation
        run: python -m unittest discover -s scripts -p test_task_git_isolation.py

      - name: Verify Unix hook cleanup
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p test_check_codex_hooks.py

      - name: Verify semantic release and archive safety gates
        run: python -m unittest discover -s scripts -p 'test_release_*.py'

      - name: Test clean installation
        run: python scripts/smoke.py


  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run Search Benchmarks
        run: go test -bench=. -benchmem ./internal/search/...

  check-goreleaser:
    name: Check GoReleaser Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Check GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.1
          args: check

  frontend:
    name: Frontend & WebFS Drift Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26.11.1"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Web Dependencies
        run: cd web && npm ci

      - name: Audit All Web Dependencies
        run: cd web && npm run audit

      - name: Lint Frontend
        run: cd web && npm run lint

      - name: Check Frontend Types
        run: cd web && npm run typecheck

      - name: Test Frontend
        run: cd web && npm test

      - name: Build Web Assets from Source
        run: cd web && npm run build

      - name: Verify WebFS Dist Integrity (Anti-Tampering & Drift Check)
        run: |
          rm -rf internal/webfs/dist && cp -r web/dist internal/webfs/dist
          if ! git diff --exit-code internal/webfs/dist; then
            echo "::error::internal/webfs/dist is out of sync with web/src or contains direct/manual modifications!"
            echo "::error::Changes to internal/webfs/dist must only occur as a result of building web/src."
            echo "::notice::Run 'task web-build' locally and stage internal/webfs/dist before pushing."
            exit 1
          fi
          echo "✅ internal/webfs/dist strictly matches clean build from web/src"


  e2e:
    name: Browser invariants (isolated demonstration vault)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@v5
        with:
          node-version: "26.11.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify camera and application invariants
        shell: bash
        run: npx playwright test 2>&1 | tee "$RUNNER_TEMP/browser-test.log"
        env:
          DANEEL_E2E_PREVIEW: "1"
          DEBUG: pw:webserver
        working-directory: web
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            web/test-results/
            ${{ runner.temp }}/browser-test.log
          retention-days: 7
