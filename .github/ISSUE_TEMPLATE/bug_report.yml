name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Daneel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Daneel Version
      description: What version of Daneel are you running? (Run `daneel version`)
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (x86_64)
        - Linux (ARM64)
        - macOS (Apple Silicon / ARM64)
        - macOS (Intel / x86_64)
        - Windows (x86_64)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Run 'daneel search ...'
        2. Expected behavior...
        3. Actual behavior...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Command Output or Logs
      description: Run with `--verbose` and paste relevant terminal logs or error messages.
      render: shell
