version: 2

project_name: daneel

before:
  hooks:
    - go mod verify

builds:
  - id: daneel
    main: ./main.go
    binary: daneel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/rjfonseca/daneel/cmd.Version={{.Version}}
      - -X github.com/rjfonseca/daneel/cmd.Commit={{.Commit}}
      - -X github.com/rjfonseca/daneel/cmd.Date={{.Date}}

archives:
  - id: daneel-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto

sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "spdx-json=$document"]
