version: '3'

vars:
  BINARY_NAME: daneel
  BUILD_DIR: bin
  BIN_DIR: '{{.HOME}}/.local/bin'

tasks:
  default:
    desc: Runs default build workflow
    cmds:
      - task: build

  build:
    desc: Compiles static binary via GoReleaser or go build
    deps: [web-build]
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - 'goreleaser build --single-target --snapshot --clean -o {{.BUILD_DIR}}/{{.BINARY_NAME}} 2>/dev/null || go build -ldflags="-s -w" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} main.go'
    env:
      CGO_ENABLED: '0'

  fmt:
    desc: Formats code with goimports
    cmds:
      - goimports -w -local github.com/rjfonseca/daneel .
      - echo "✅ Code formatted successfully"

  test:
    desc: Runs complete unit and integration test suite with coverage
    env:
      DANEEL_VAULT_PATH: ''
      DANEEL_CONFIG: ''
    cmds:
      - |
        unset $(git rev-parse --local-env-vars)
        go test -v -cover ./...

  bench:
    desc: Runs search and indexing performance benchmarks
    env:
      DANEEL_VAULT_PATH: ''
      DANEEL_CONFIG: ''
    cmds:
      - |
        unset $(git rev-parse --local-env-vars)
        go test -bench=. -benchmem ./internal/search/...

  lint:
    desc: Runs strict static analysis with golangci-lint
    cmds:
      - 'golangci-lint run ./...'

  vulncheck:
    desc: Runs govulncheck to find known vulnerabilities
    cmds:
      - govulncheck ./...

  lint-fix:
    desc: Runs golangci-lint applying automated fixes
    cmds:
      - 'golangci-lint run --fix ./... 2>/dev/null || true'

  install:
    desc: Installs daneel binary to standard Linux user directory (~/.local/bin/daneel)
    deps: [build]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - cp -f {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.BIN_DIR}}/{{.BINARY_NAME}}
      - chmod +x {{.BIN_DIR}}/{{.BINARY_NAME}}
      - echo "✅ 'daneel' successfully installed to {{.BIN_DIR}}/{{.BINARY_NAME}}"

  uninstall:
    desc: Removes daneel binary from ~/.local/bin
    cmds:
      - rm -f {{.BIN_DIR}}/{{.BINARY_NAME}}
      - echo "🗑️ 'daneel' binary removed from {{.BIN_DIR}}/"

  hooks:
    desc: Installs and syncs Lefthook git hooks
    cmds:
      - lefthook install
      - echo "🪝 Git hooks (Lefthook) installed for this repository"

  clean:
    desc: Removes build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist/

  proto-gen:
    desc: Generates Protobuf and ConnectRPC bindings
    cmds:
      - PATH="$PWD/web/node_modules/.bin:$PATH" buf generate
      - cd web && npm run build:proto || true

  web-deps:
    desc: Installs web frontend dependencies
    cmds:
      - cd web && npm install

  web-build:
    desc: Builds the web frontend for embedding
    sources:
      - 'web/src/**/*'
      - 'web/public/**/*'
      - 'web/package.json'
      - 'web/vite.config.ts'
      - 'web/index.html'
    generates:
      - 'internal/webfs/dist/index.html'
    cmds:
      - cd web && npm run build
      - rm -rf internal/webfs/dist && cp -r web/dist internal/webfs/dist

  web-verify-sync:
    desc: Verifies that internal/webfs/dist matches a clean build from web/src
    cmds:
      - task: web-build
      - |
        if ! git diff --exit-code internal/webfs/dist; then
          echo "❌ Error: internal/webfs/dist is out of sync with web/src or contains manual edits!"
          echo "Changes to internal/webfs/dist must only be generated by building web/src."
          echo "Run 'task web-build' and stage the resulting internal/webfs/dist directory."
          exit 1
        fi
        echo "✅ internal/webfs/dist matches clean build from web/src"

  dev:
    desc: Starts full-stack development environment (Go backend on :3000 + Vite frontend on :5173 in parallel)
    aliases: [run-dev]
    deps:
      - dev-backend
      - dev-frontend

  dev-backend:
    desc: Starts Go backend server on port 3000 with auto-reload (air)
    aliases: [run-dev-backend]
    cmds:
      - |
        if command -v air >/dev/null 2>&1; then
          air -c .air.toml
        else
          echo "💡 Tip: Run 'mise install' to enable hot-reload via air"
          go run . serve --port 3000
        fi

  dev-frontend:
    desc: Starts Vite frontend development server on port 5173
    aliases: [run-dev-frontend]
    dir: web
    env:
      VITE_API_URL: http://localhost:3000
    cmds:
      - npm run dev


