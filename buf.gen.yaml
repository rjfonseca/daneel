version: v1
plugins:
  - plugin: buf.build/protocolbuffers/go
    out: .
    opt: paths=source_relative
  - plugin: buf.build/connectrpc/go
    out: .
    opt: paths=source_relative
  - plugin: es
    out: web/src/gen
    opt: target=ts
  - plugin: connect-es
    out: web/src/gen
    opt: target=ts
